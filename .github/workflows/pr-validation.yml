name: PR Fast Validation

on:
  push:
    branches:
      - 'codex/**'
  pull_request:
    branches:
      - develop
      - rearchitecture-p2p-swap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze rearchitecture code
        run: flutter analyze --no-pub --no-fatal-infos lib/rearchitecture

      - name: Run unit and widget tests
        run: flutter test --no-pub test --exclude-tags chain

      - name: Check generated files are up to date
        run: |
          # Generated Dart files are committed in this repository. Regenerating
          # them in CI catches stale JSON/Hive/BDD outputs before they are merged.
          dart run build_runner build
          dart format integration_test
          git diff --exit-code
